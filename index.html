<style>
  :root {
    --parchment: #f3ece1;
    --ink:       #1a1612;
    --ink-soft:  #6a6258;
    --rule:      #cdc4b6;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--parchment); }
  body {
    background: var(--parchment);
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
    font-size: 21px;
    line-height: 1.55;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  main {
    max-width: 620px;
    margin: 0 auto;
    padding: 16vh 28px 20vh;
  }

  h1 {
    font-weight: 500;
    font-size: 40px;
    line-height: 1.15;
    letter-spacing: -0.005em;
    margin-bottom: 0.35em;
  }

  .lede {
    color: var(--ink-soft);
    margin-bottom: 5em;
  }

  section { margin-bottom: 5em; }
  p + p { margin-top: 1.1em; }

  figure {
    margin: 7em -28px;
  }
  figure img {
    width: 100%;
    height: auto;
    display: block;
  }
  @media (min-width: 720px) {
    figure { margin: 8em -60px; }
  }
  @media (min-width: 1000px) {
    figure { margin: 9em -120px; }
  }

  figure.portrait {
    margin: 6em auto;
    max-width: 280px;
  }

  .links {
    margin-top: 6em;
    display: flex;
    flex-wrap: wrap;
    gap: 1.1em 2em;
  }
  .links a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1px;
    transition: border-color 180ms ease;
  }
  .links a:hover { border-bottom-color: var(--ink); }

  .colophon {
    margin-top: 9em;
    color: var(--ink-soft);
    font-size: 16px;
    font-style: italic;
  }

  ::selection { background: #e0d4bd; }
</style>

  </div>

  <p class="colophon">2026 &middot; New York</p>

</main>
